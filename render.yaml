services:
  - type: web
    name: pacing-lead-analyzer
    env: python
    plan: starter
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: REQUIRE_LOGIN
        value: true
      - key: TEAM_APP_USERNAME
        sync: false
      - key: TEAM_APP_PASSWORD
        sync: false
